name: Mod Release
run-name: Mod Release ${{ github.event.inputs.tag || github.ref_name }}

# Publishes the Vermeil companion mod jars (one per build project) and
# a manifest the launcher fetches for download-on-demand install. The jars are
# release assets — never committed to the repo. Triggered by a `mod-v*` tag, or
# manually via workflow_dispatch with a tag input.
#
# The mod is versioned independently of the launcher (its `mod_version` lives in
# companion-mod/fabric/26.1-26.2/gradle.properties). The launcher reads companion-manifest.json to
# find the jar matching an instance's Minecraft version + loader, then downloads
# and SHA-1-verifies it. See services/companion_mod.rs.

on:
  push:
    tags:
      - 'mod-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish the mod release under (e.g. mod-v0.1.0)'
        required: true

jobs:
  mod-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The companion mod spans toolchains: the modern multi-loader (Fabric &
      # NeoForge) builds on JDK 25 via Stonecutter, the legacy Forge 1.8.9 build
      # needs JDK 8.
      - name: Setup JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the mods
        run: |
          set -euo pipefail
          chmod +x companion-mod/stonecutter/gradlew companion-mod/forge/1.8.9/gradlew
          # Modern multi-loader (Fabric & NeoForge for 1.21.11, 26.1, 26.2, 26.3)
          sed -i '/^org\.gradle\.java\.home=/d' companion-mod/stonecutter/gradle.properties
          (cd companion-mod/stonecutter && JAVA_HOME="$JAVA_HOME_25_X64" ./gradlew chiseledBuildAndCollect --console=plain)
          # Legacy Forge 1.8.9: classic ForgeGradle 2 on Gradle 3.1 + JDK 8. --no-daemon
          # because the old Gradle shouldn't linger; build pulls in the decomp
          # workspace automatically (3G heap is set in its gradle.properties).
          sed -i '/^org\.gradle\.java\.home=/d' companion-mod/forge/1.8.9/gradle.properties
          (cd companion-mod/forge/1.8.9 && JAVA_HOME="$JAVA_HOME_8_X64" ./gradlew build --console=plain --no-daemon)

      - name: Stage jars and build manifest
        id: stage
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          REPO="${{ github.repository }}"
          MODVER=$(grep -E '^mod\.version=' companion-mod/stonecutter/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "Publishing companion mod $MODVER under tag $TAG"

          mkdir -p dist
          entries='[]'
          shopt -s nullglob

          # 1. Stage modern multi-loader jars (Fabric & NeoForge) from Stonecutter
          for jar in companion-mod/stonecutter/build/libs/*.jar; do
            file=$(basename "$jar")
            case "$file" in
              *fabric*)   loaders='["fabric","quilt"]' ;;
              *neoforge*) loaders='["neoforge"]' ;;
              *) echo "Unknown loader for $file" >&2; exit 1 ;;
            esac
            mc_ver="${file##*+mc}"
            mc_ver="${mc_ver%.jar}"
            extra=$(grep -E '^additional_versions=' "companion-mod/stonecutter/versions/dependencies/${mc_ver}.properties" 2>/dev/null | cut -d= -f2 | tr -d '[:space:]' || true)
            if [ -n "$extra" ]; then
              vjson=$(echo "$mc_ver,$extra" | jq -R 'split(",")')
            else
              vjson=$(jq -n --arg v "$mc_ver" '[$v]')
            fi
            cp "$jar" "dist/$file"
            sha1=$(sha1sum "$jar" | cut -d' ' -f1)
            size=$(stat -c%s "$jar")
            url="https://github.com/${REPO}/releases/download/${TAG}/${file}"
            entries=$(echo "$entries" | jq \
              --argjson mcs "$vjson" --argjson loaders "$loaders" --arg file "$file" --arg url "$url" --arg sha1 "$sha1" --argjson size "$size" \
              '. + [{minecraftVersions:$mcs, loaders:$loaders, file:$file, url:$url, sha1:$sha1, size:$size}]')
          done

          # 2. Stage legacy Forge 1.8.9 jar
          for jar in companion-mod/forge/1.8.9/build/libs/vermeil-*.jar; do
            file=$(basename "$jar")
            loaders='["forge"]'
            vjson='["1.8.9"]'
            cp "$jar" "dist/$file"
            sha1=$(sha1sum "$jar" | cut -d' ' -f1)
            size=$(stat -c%s "$jar")
            url="https://github.com/${REPO}/releases/download/${TAG}/${file}"
            entries=$(echo "$entries" | jq \
              --argjson mcs "$vjson" --argjson loaders "$loaders" --arg file "$file" --arg url "$url" --arg sha1 "$sha1" --argjson size "$size" \
              '. + [{minecraftVersions:$mcs, loaders:$loaders, file:$file, url:$url, sha1:$sha1, size:$size}]')
          done

          if [ "$entries" = "[]" ]; then
            echo "No jars were produced — failing." >&2
            exit 1
          fi

          jq -n --arg modVersion "$MODVER" --argjson entries "$entries" \
            '{modVersion:$modVersion, entries:$entries}' > dist/companion-manifest.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "--- companion-manifest.json ---"
          cat dist/companion-manifest.json
          echo "--- dist contents ---"
          ls -l dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.stage.outputs.tag }}"
          # Create the release if it doesn't exist yet, then (re)upload assets.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Vermeil companion mod ${TAG#mod-}" \
              --latest=false \
              --notes "Companion mod jars for the in-game cape feature. Installed automatically by the launcher; not meant to be downloaded by hand."
          fi
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
